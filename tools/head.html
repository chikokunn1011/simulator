<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>/* 引っ越し：chikokunn1011.github.io・chiko-studia.pages.dev → sapia.pages.dev（全サイト共通。直すときは全サイトそろえる）
  古いURLで開いたら、端末に保存した記録（続きから・見た目・学習記録など）を持って新しいURLへ移る。
  新しいURL側では受け取った記録を、まだないものだけ入れる。記録は # の後ろに入れるのでサーバーには送られない。 */
(function () {
  var NEW = 'https://sapia.pages.dev', K = '__move=', MAX = 1500000;
  var OLD = ['chikokunn1011.github.io', 'chiko-studia.pages.dev'];
  try {
    if (OLD.indexOf(location.hostname) >= 0) {
      if (window.top !== window) return;
      var h = location.hash.slice(1), frag = h ? '#' + h : '';
      try {
        if (!localStorage.getItem('studia:moved')) {
          var d = {}, n = 0;
          for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); d[k] = localStorage.getItem(k); n++; }
          var s = encodeURIComponent(JSON.stringify(d));
          if (n && s.length < MAX) frag = '#' + K + s + (h ? '&h=' + encodeURIComponent(h) : '');
          localStorage.setItem('studia:moved', String(Date.now()));
        }
      } catch (e) {}
      location.replace(NEW + location.pathname + location.search + frag);
    } else if (location.hash.indexOf('#' + K) === 0) {
      // 受け取るのは引っ越し前のサイト（github.io・chiko-studia）から来たときだけ。よそのリンクから記録を書きこませない。
      // 先生の鍵・ランキングの合言葉などは受け取らない（学習記録と設定だけ）。
      var q = location.hash.slice(1 + K.length), a = q.indexOf('&h=');
      var hh = a < 0 ? '' : decodeURIComponent(q.slice(a + 3));
      history.replaceState(null, '', location.pathname + location.search + (hh ? '#' + hh : ''));
      var ok = false;
      for (var j = 0; j < OLD.length; j++) if (document.referrer.indexOf('https://' + OLD[j] + '/') === 0) ok = true;
      if (!ok || q.length > MAX + 5000) return;
      var o = JSON.parse(decodeURIComponent(a < 0 ? q : q.slice(0, a))), n = 0;
      if (!o || typeof o !== 'object' || Array.isArray(o)) return;
      for (var key in o) {
        if (++n > 500) break;
        var v = o[key];
        if (typeof v !== 'string' || v.length > 500000 || key.length > 100) continue;
        if (key === 'studia:moved' || /teacher|key|token|pass|secret|^pz:(me|run)$/i.test(key)) continue;
        // 記録の中の古いURL（続きからなど）は新しいURLに直す
        v = v.split('https://chiko-studia.pages.dev').join(NEW);
        if (localStorage.getItem(key) === null) localStorage.setItem(key, v);
      }
    }
  } catch (e) {}
})();</script>

<script>
// オフライン対応：一度開けば電波がなくても使える（sw.js）。ホーム画面から開くとアプリのように起動する
(function () {
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) return;
  if (performance.setResourceTimingBufferSize) performance.setResourceTimingBufferSize(2000);
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
      var urls = [location.href].concat(performance.getEntriesByType('resource').map(function (e) { return e.name; }), []);
      if (reg.active) reg.active.postMessage({ type: 'cache-urls', urls: urls });
    }).catch(function () {});
  });
})();
</script>

<script>
// 見た目（スタイル）を最初の描画の前に当てる。書体はそのスタイルを選んだときだけ読みこむ
window.ewStyle = function (st) {
  var F = {
    chalk: 'Klee+One:wght@400;600&family=Kalam:wght@400;700',
    washi: 'Zen+Old+Mincho:wght@400;700&family=EB+Garamond:wght@500;600',
    grid: 'IBM+Plex+Sans+JP:wght@400;700&family=Space+Grotesk:wght@500;600',
    night: '',
    sakura: 'Zen+Maru+Gothic:wght@500;700&family=Quicksand:wght@500;700',
    kraft: 'Kosugi+Maru',
    ocean: 'M+PLUS+1p:wght@400;700;800&family=Nunito:wght@600;800',
    forest: 'Merriweather+Sans:wght@500;700',
    retro: 'DotGothic16',
    dot: 'DotGothic16'
  };
  if (!Object.prototype.hasOwnProperty.call(F, st)) { delete document.documentElement.dataset.style; return; }
  document.documentElement.dataset.style = st;
  if (F[st] && !document.getElementById('font-' + st)) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.id = 'font-' + st;
    l.href = 'https://fonts.googleapis.com/css2?family=' + F[st] + '&display=swap';
    document.head.appendChild(l);
  }
};
try { window.ewStyle(JSON.parse(localStorage.getItem('ew:style'))); } catch (e) {}
</script>
